            <div style={{flex:1}}>
              <div style={{fontSize:20,fontWeight:900,color:cat.color,marginBottom:4}}>{cat.label}</div>

            <div style={{position:"relative",marginBottom:8}}>
              <div style={{height:10,borderRadius:99,background:`linear-gradient(90deg,${C.blue} 0%,${C.neon} 30%,${C.amber} 62%,${C.coral} 100%)`}}/>
              <div style={{position:"absolute",top:-3,left:`${Math.min(Math.max(bmiPct*100,1),98)}%`,transform:"translateX(-50%)",width:4,height:16,background:"#fff",borderRadius:99,boxShadow:"0 0 6px rgba(255,255,255,0.6)"}}/>
            </div>
            <div style={{display:"flex",justifyContent:"space-between"}}>

                <div key={r.l} style={{textAlign:"center"}}>
                  <div style={{fontSize:9,color:r.c,fontWeight:700}}>{r.l}</div>
                  <div style={{fontSize:8,color:C.muted}}>{r.v}</div>
                </div>
              ))}
            </div>
          </div>

          {/* Ideal weight */}
          {ideal&&(
            <div style={{background:"rgba(0,0,0,0.28)",borderRadius:16,padding:16}}>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.08em",color:C.sub,marginBottom:12}}>IDEAL WEIGHT FOR YOU</div>
              <div style={{textAlign:"center",background:`${C.neon}12`,borderRadius:12,padding:"14px 10px",marginBottom:12}}>
                <div style={{fontSize:26,fontWeight:900,color:C.neon}}>
                  {useKg?`${ideal.minKg} - ${ideal.maxKg} kg`:`${ideal.minLbs} - ${ideal.maxLbs} lbs`}
                </div>
                <div style={{fontSize:11,color:C.sub,marginTop:4}}>Healthy range for your height and gender</div>
              </div>
              <div style={{fontSize:11,color:C.sub,textAlign:"center",marginBottom:12,lineHeight:1.5}}>
                Calculated using the Devine formula
              </div>
              {(()=>{
                const curKg=profile.weightUnit==="lbs"?Number(profile.weight)*0.453592:Number(profile.weight);
                const diff=curKg-ideal.idealKg;
                if(Math.abs(diff)<2) return(
                  <div style={{padding:"11px 14px",background:`${C.neon}12`,border:`1px solid ${C.neon}33`,borderRadius:12,textAlign:"center"}}>
                    <div style={{fontSize:14,fontWeight:800,color:C.neon}}>You are at your ideal weight!</div>
                  </div>
                );
                const amt=useKg?Math.abs(diff).toFixed(1)+" kg":(Math.abs(diff)*2.20462).toFixed(0)+" lbs";
                return(
                  <div style={{padding:"11px 14px",background:`${diff>0?C.amber:C.blue}12`,border:`1px solid ${diff>0?C.amber:C.blue}33`,borderRadius:12,textAlign:"center"}}>
                    <div style={{fontSize:14,fontWeight:800,color:diff>0?C.amber:C.blue}}>
                      {diff>0?`Lose ${amt} to reach ideal weight`:`Gain ${amt} to reach ideal weight`}
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      )}

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:17}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}><span style={{fontSize:13,fontWeight:700,color:C.text}}>Level {level}</span><span style={{fontSize:12,color:C.sub}}>{xp} / {xpNext} XP</span></div>
        <div style={{height:8,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${Math.min(xp/xpNext*100,100)}%`,background:`linear-gradient(90deg,${C.neon},${C.purple})`,borderRadius:99,transition:"width 1s"}}/>
        </div>
        <div style={{fontSize:11,color:C.sub,marginTop:7}}>{Math.max(xpNext-xp,0)} XP to Level {level+1}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:9}}>
        {[{l:"Habits",v:String(habits.length)},{l:"Best Streak",v:String(bestStreak)},{l:"Done Today",v:String(totalDone)}].map(s=>(
          <div key={s.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:17,padding:"13px 9px",textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:900,color:C.neon}}>{s.v}</div>
            <div style={{fontSize:10,color:C.sub,marginTop:3}}>{s.l}</div>
          </div>
        ))}
      </div>

      <WeightTrackerCard profile={profile}/>
      <NotificationsCard/>
    </div>
  );
}

// -- WEIGHT TRACKER -----------------------------------------------------------
function WeightTrackerCard({profile}){
  const [log,setLogRaw]=useState(()=>lsGet('mom_weight_log',[]));
  const [input,setInput]=useState(profile?.weight||"");
  const [unit,setUnit]=useState(profile?.weightUnit||"kg");
  const [range,setRange]=useState(7);
  const setLog=fn=>{setLogRaw(prev=>{const next=typeof fn==='function'?fn(prev):fn;lsSet('mom_weight_log',next);return next;});};

  function addEntry(){
    const w=Number(input);if(!w||w<=0)return;
    const today=new Date().toISOString().split("T")[0];
    const entry={date:today,weight:w,unit};
    setLog(p=>{const filtered=p.filter(x=>x.date!==today);return[...filtered,entry].sort((a,b)=>a.date.localeCompare(b.date));});
    setInput("");
  }

  const filtered=log.filter(e=>{
    const d=new Date();d.setDate(d.getDate()-range);
    return new Date(e.date)>=d;
  });

  // Normalize all to same unit for graphing
  const toKg=w=>unit==="lbs"?w/2.20462:w;
  const pts=filtered.map(e=>({...e,kg:e.unit==="lbs"?e.weight/2.20462:e.weight}));
  const vals=pts.map(p=>p.kg);
  const minV=vals.length?Math.min(...vals)-1:60;
  const maxV=vals.length?Math.max(...vals)+1:100;
  const graphH=100;const graphW=280;
  const xScale=pts.length>1?(graphW-24)/(pts.length-1):0;
  const yScale=maxV>minV?graphH/(maxV-minV):1;
  const points=pts.map((p,i)=>`${i===0?'M':'L'}${12+i*xScale},${graphH-(p.kg-minV)*yScale}`).join(" ");

  const latest=pts.length?pts[pts.length-1]:null;
  const prev7=pts.length>1?pts[0]:null;
  const diff=latest&&prev7?((latest.kg-prev7.kg)).toFixed(1):null;

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:17}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:C.sub,marginBottom:14}}>WEIGHT TRACKER</div>

      {/* Log today */}
      <div style={{marginBottom:14}}>
        <input type="number" value={input} onChange={e=>setInput(e.target.value)} placeholder="e.g. 72.5"
          style={{width:"100%",boxSizing:"border-box",background:"#1a1a1a",border:`1px solid ${C.borderHi}`,borderRadius:12,padding:"11px 13px",color:C.text,fontSize:16,fontWeight:800,outline:"none",fontFamily:"inherit",marginBottom:8}}/>
        <div style={{display:"flex",gap:8}}>
          <div style={{display:"flex",background:"#1a1a1a",borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden",flexShrink:0}}>
            {["kg","lbs"].map(u=><button key={u} onClick={()=>setUnit(u)} style={{padding:"10px 16px",border:"none",background:unit===u?C.amber:"transparent",color:unit===u?"#000":C.sub,fontWeight:700,fontSize:13,cursor:"pointer"}}>{u}</button>)}
          </div>
          <button onClick={addEntry} style={{flex:1,padding:"10px",borderRadius:12,border:"none",background:C.amber,color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>Log Weight</button>
        </div>
      </div>

      {pts.length>0&&(
        <>
          {/* Stats row */}
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <div style={{flex:1,background:"#1e1e1e",borderRadius:12,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:900,color:C.amber}}>{latest?`${latest.weight}${latest.unit}`:"--"}</div>
              <div style={{fontSize:10,color:C.sub,marginTop:2}}>Latest</div>
            </div>
            {diff!==null&&<div style={{flex:1,background:"#1e1e1e",borderRadius:12,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:900,color:Number(diff)<=0?C.neon:C.coral}}>{Number(diff)>0?"+":""}{diff} kg</div>
              <div style={{fontSize:10,color:C.sub,marginTop:2}}>Change</div>
            </div>}
            <div style={{flex:1,background:"#1e1e1e",borderRadius:12,padding:"10px 12px",textAlign:"center"}}>
              <div style={{fontSize:18,fontWeight:900,color:C.purple}}>{pts.length}</div>
              <div style={{fontSize:10,color:C.sub,marginTop:2}}>Entries</div>
            </div>
          </div>

          {/* Range selector */}
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {[7,30,90].map(r=>(
              <button key={r} onClick={()=>setRange(r)} style={{flex:1,padding:"7px",borderRadius:10,border:`1px solid ${range===r?C.amber:C.border}`,background:range===r?C.amberD:"#1a1a1a",color:range===r?C.amber:C.sub,fontWeight:range===r?700:400,fontSize:12,cursor:"pointer"}}>{r}d</button>
            ))}
          </div>

          {/* Line graph */}
          {pts.length>=2?(
            <div style={{background:"#111",borderRadius:14,padding:"12px 8px 8px"}}>
              <svg width="100%" viewBox={`0 0 ${graphW} ${graphH+24}`} preserveAspectRatio="none" style={{display:"block"}}>
                {/* Grid lines */}
                {[0,0.5,1].map(f=>(
                  <line key={f} x1="12" y1={graphH*f} x2={graphW-12} y2={graphH*f} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
                ))}
                {/* Area fill */}
                <path d={`${points} L${12+(pts.length-1)*xScale},${graphH} L12,${graphH} Z`} fill={`rgba(245,158,11,0.08)`}/>
                {/* Line */}
                <path d={points} fill="none" stroke={C.amber} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{filter:"drop-shadow(0 0 4px rgba(245,158,11,0.6))"}}/>
                {/* Dots */}
                {pts.map((p,i)=>(
                  <circle key={i} cx={12+i*xScale} cy={graphH-(p.kg-minV)*yScale} r="4" fill={C.amber} stroke="#111" strokeWidth="2"/>
                ))}
                {/* X labels */}
                {pts.filter((_,i)=>i===0||i===pts.length-1||(pts.length<=7)).map((p,i,arr)=>(
                  <text key={i} x={12+pts.indexOf(p)*xScale} y={graphH+16} textAnchor="middle" fontSize="9" fill={C.sub}>
                    {p.date.slice(5)}
                  </text>
                ))}
              </svg>
            </div>
          ):(
            <div style={{textAlign:"center",padding:"16px 0",fontSize:12,color:C.sub}}>Log at least 2 entries to see the graph</div>
          )}
        </>
      )}
      {pts.length===0&&(
        <div style={{textAlign:"center",padding:"16px 0",fontSize:13,color:C.sub}}>No entries yet — log your weight above to start tracking</div>
      )}
    </div>
  );
}

// -- NOTIFICATIONS ------------------------------------------------------------
function NotificationsCard(){
  const [perm,setPerm]=useState(()=>typeof Notification!=='undefined'?Notification.permission:'unsupported');
  const [enabled,setEnabled]=useState(()=>lsGet('mom_notif_enabled',false));
  const [time,setTime]=useState(()=>lsGet('mom_notif_time','08:00'));
  const [saved,setSaved]=useState(false);

  async function requestPerm(){
    if(typeof Notification==='undefined'){setPerm('unsupported');return;}
    const p=await Notification.requestPermission();
    setPerm(p);
    if(p==='granted'){setEnabled(true);lsSet('mom_notif_enabled',true);}
  }

  function saveReminder(){
    lsSet('mom_notif_time',time);lsSet('mom_notif_enabled',enabled);
    setSaved(true);setTimeout(()=>setSaved(false),2000);
    // Fire a test notification
    if(perm==='granted'&&enabled){
      try{new Notification('Momentum 🌿',{body:'Your daily reminder is set for '+time+'. Stay consistent!',icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌿</text></svg>'});}catch{}
    }
  }

  function toggleEnabled(){
    const next=!enabled;setEnabled(next);lsSet('mom_notif_enabled',next);
    if(next&&perm!=='granted')requestPerm();
  }

  return(
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:20,padding:17}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:C.sub,marginBottom:14}}>DAILY REMINDER</div>
      {perm==='unsupported'&&(
        <div style={{fontSize:13,color:C.sub,lineHeight:1.6}}>Notifications are not supported in this browser. To get reminders, save this app to your iPhone Home Screen via Safari → Share → Add to Home Screen.</div>
      )}
      {perm!=='unsupported'&&(
        <>
          {perm==='denied'&&(
            <div style={{fontSize:12,color:C.coral,marginBottom:12,lineHeight:1.6,background:"rgba(255,107,107,0.08)",borderRadius:12,padding:"10px 12px"}}>Notifications are blocked. Go to iPhone Settings → Safari → Notifications to allow them.</div>
          )}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:C.text}}>Daily check-in reminder</div>
              <div style={{fontSize:11,color:C.sub,marginTop:2}}>{enabled?"Reminder is on":"Tap to enable"}</div>
            </div>
            <button onClick={toggleEnabled} style={{width:50,height:28,borderRadius:99,border:"none",background:enabled?C.neon:"rgba(255,255,255,0.1)",cursor:"pointer",position:"relative",transition:"background 0.3s",flexShrink:0}}>
              <div style={{width:20,height:20,borderRadius:"50%",background:"#fff",position:"absolute",top:4,left:enabled?26:4,transition:"left 0.25s",boxShadow:"0 1px 4px rgba(0,0,0,0.4)"}}/>
            </button>
          </div>
          {(perm==='granted'||perm==='default')&&enabled&&(
            <div>
              <div style={{fontSize:10,fontWeight:700,color:C.sub,letterSpacing:"0.08em",marginBottom:8}}>REMINDER TIME</div>
              <div style={{display:"flex",gap:8}}>
                <input type="time" value={time} onChange={e=>setTime(e.target.value)}
                  style={{flex:1,background:"#1a1a1a",border:`1px solid ${C.borderHi}`,borderRadius:13,padding:"12px 14px",color:C.text,fontSize:20,fontWeight:800,outline:"none",fontFamily:"inherit",colorScheme:"dark"}}/>
                <button onClick={saveReminder} style={{padding:"12px 18px",borderRadius:13,border:"none",background:saved?C.neon:C.purple,color:saved?"#000":"#fff",fontWeight:800,fontSize:14,cursor:"pointer",transition:"all 0.3s",whiteSpace:"nowrap"}}>
                  {saved?"Saved ✓":"Save"}
                </button>
              </div>
              <div style={{fontSize:11,color:C.sub,marginTop:9,lineHeight:1.6}}>
                For reminders to work on iOS, save Momentum to your Home Screen via Safari → Share → Add to Home Screen.
              </div>
            </div>
          )}
          {perm==='default'&&!enabled&&(
            <button onClick={requestPerm} style={{width:"100%",padding:"13px",borderRadius:13,border:"none",background:C.purple,color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:"0 0 18px rgba(168,85,247,0.32)"}}>
              Enable Notifications
            </button>
          )}
        </>
      )}
    </div>
  );
}

        <input type="range" min="10" max="80" value={d.age||25} onChange={e=>set("age",e.target.value)}

        </div>
      </div>

        </div>
        {d.weightUnit==="kg"?(
          <input type="range" min="30" max="200" value={d.weight||70} onChange={e=>set("weight",e.target.value)}
            style={{width:"100%",height:6,appearance:"none",WebkitAppearance:"none",background:`linear-gradient(to right,${C.amber} 0%,${C.amber} ${((Number(d.weight||70)-30)/170)*100}%,rgba(255,255,255,0.1) ${((Number(d.weight||70)-30)/170)*100}%,rgba(255,255,255,0.1) 100%)`,borderRadius:99,outline:"none",cursor:"pointer"}}/>
        ):(
          <input type="range" min="66" max="440" value={d.weight||154} onChange={e=>set("weight",e.target.value)}
            style={{width:"100%",height:6,appearance:"none",WebkitAppearance:"none",background:`linear-gradient(to right,${C.amber} 0%,${C.amber} ${((Number(d.weight||154)-66)/374)*100}%,rgba(255,255,255,0.1) ${((Number(d.weight||154)-66)/374)*100}%,rgba(255,255,255,0.1) 100%)`,borderRadius:99,outline:"none",cursor:"pointer"}}/>
        )}
      </div>
      <div>
        <div style={{fontSize:11,fontWeight:700,color:C.sub,letterSpacing:"0.08em",marginBottom:8}}>HEIGHT</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <button onClick={()=>set("height",String(Math.max(d.heightUnit==="cm"?100:39,Number(d.height||(d.heightUnit==="cm"?170:67))-1)))} style={{width:40,height:40,borderRadius:"50%",border:`1px solid ${C.border}`,background:"#1e1e1e",color:C.text,cursor:"pointer",fontSize:22,fontWeight:700}}>−</button>
          <div style={{textAlign:"center",display:"flex",alignItems:"baseline",gap:8}}>
            <span style={{fontSize:48,fontWeight:900,color:C.blue,letterSpacing:"-0.04em"}}>
              {d.heightUnit==="cm"?(d.height||170):(()=>{const tot=Number(d.height||67);return `${Math.floor(tot/12)}'${tot%12}"`;})()}
            </span>
            <UnitToggle opts={["cm","ft"]} val={d.heightUnit} onChange={v=>{
              const cur=Number(d.height||170);
              if(v==="ft"&&d.heightUnit==="cm") set("height",Math.round(cur/2.54).toString());
              else if(v==="cm"&&d.heightUnit==="ft") set("height",Math.round(cur*2.54).toString());
              set("heightUnit",v);
            }} color={C.blue}/>
          </div>
          <button onClick={()=>set("height",String(Math.min(d.heightUnit==="cm"?230:91,Number(d.height||(d.heightUnit==="cm"?170:67))+1)))} style={{width:40,height:40,borderRadius:"50%",border:`1px solid ${C.blue}`,background:C.blueD,color:C.blue,cursor:"pointer",fontSize:22,fontWeight:700}}>+</button>
        </div>
        {d.heightUnit==="cm"?(
          <input type="range" min="100" max="230" value={d.height||170} onChange={e=>set("height",e.target.value)}
            style={{width:"100%",height:6,appearance:"none",WebkitAppearance:"none",background:`linear-gradient(to right,${C.blue} 0%,${C.blue} ${((Number(d.height||170)-100)/130)*100}%,rgba(255,255,255,0.1) ${((Number(d.height||170)-100)/130)*100}%,rgba(255,255,255,0.1) 100%)`,borderRadius:99,outline:"none",cursor:"pointer"}}/>
        ):(
          <input type="range" min="39" max="91" value={d.height||67} onChange={e=>set("height",e.target.value)}
            style={{width:"100%",height:6,appearance:"none",WebkitAppearance:"none",background:`linear-gradient(to right,${C.blue} 0%,${C.blue} ${((Number(d.height||67)-39)/52)*100}%,rgba(255,255,255,0.1) ${((Number(d.height||67)-39)/52)*100}%,rgba(255,255,255,0.1) 100%)`,borderRadius:99,outline:"none",cursor:"pointer"}}/>
        )}
      </div>
    </div>,
    // Step 4: Summary
    <div style={{background:C.card,border:`1px solid ${C.borderHi}`,borderRadius:18,padding:18,marginBottom:8,textAlign:"left"}}>
      {[
        {l:"Name",   v:d.name},
        {l:"Age",    v:(d.age||25)+" years"},
        {l:"Gender", v:d.gender},
        {l:"Weight", v:(d.weight||70)+" "+d.weightUnit},
        {l:"Height", v:d.heightUnit==="cm"?(d.height||170)+" cm":(()=>{const tot=Number(d.height||67);return Math.floor(tot/12)+"'"+tot%12+'"'})()},
      ].map((r,i,arr)=>(
        <div key={r.l} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderBottom:i<arr.length-1?`1px solid ${C.border}`:"none"}}>
          <span style={{fontSize:12,color:C.sub,width:56}}>{r.l}</span>
          <span style={{fontSize:14,fontWeight:700,color:C.text,flex:1}}>{r.v}</span>
        </div>
      ))}
    </div>,
  ];

  return(
    <div style={{width:"100%",minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:28,fontFamily:"'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif",boxSizing:"border-box",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
      <div style={{textAlign:"center",maxWidth:360,width:"100%"}}>
        <div style={{width:74,height:74,borderRadius:22,background:`${col}18`,border:`2px solid ${col}44`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 18px"}}>{icons[step]}</div>
        <h1 style={{fontSize:24,fontWeight:900,letterSpacing:"-0.04em",color:C.text,marginBottom:10,lineHeight:1.2}}>{titles[step]}</h1>
        <p style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:22}}>{subs[step]}</p>
        {content[step]}
        <button
          onClick={()=>{ if(!canNext)return; if(step<4)setStep(n=>n+1); else onDone(d); }}
          style={{width:"100%",padding:"15px",borderRadius:17,border:"none",background:canNext?col:"rgba(255,255,255,0.08)",color:canNext?"#000":"#555",fontSize:16,fontWeight:800,cursor:canNext?"pointer":"not-allowed",boxShadow:canNext?`0 0 28px ${col}55`:"none",transition:"all 0.2s",marginBottom:14}}>
          {step<4?"Continue":"Start Building"}
        </button>
        {step>0&&<button onClick={()=>setStep(n=>n-1)} style={{background:"transparent",border:"none",color:C.sub,fontSize:13,cursor:"pointer",padding:"6px"}}>Back</button>}
        <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:14}}>
          {[0,1,2,3,4].map(i=><div key={i} style={{width:i===step?18:6,height:6,borderRadius:99,background:i===step?col:"rgba(255,255,255,0.14)",transition:"all 0.3s"}}/>)}
        </div>
      </div>
    </div>
  );
}

// -- WEEKLY REPORT ------------------------------------------------------------
function WeeklyReport({habits,profile}){
  const sleepHistory=lsGet("mom_sleep",[]);
  const todayLog=lsGet('mom_macros_v2',{entries:[]}).entries||[];
  const archive=lsGet('mom_macros_archive',[]);
  const macroLog=[...todayLog,...archive.flatMap(d=>d.entries||[])];

  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const now=new Date();
  const dayOfWeek=now.getDay();
  const startOfWeek=new Date(now);
  startOfWeek.setDate(now.getDate()-((dayOfWeek+6)%7));
  startOfWeek.setHours(0,0,0,0);

  // Habit stats
  const totalHabits=habits.length;
  const completedToday=habits.filter(h=>h.done).length;
  const completionPct=totalHabits?Math.round(completedToday/totalHabits*100):0;
  const totalXP=habits.filter(h=>h.done).reduce((s,h)=>s+h.xp,0);
  const bestStreak=habits.length?Math.max(...habits.map(h=>h.streak)):0;

  // Sleep stats (last 7 entries)
  const weekSleep=sleepHistory.slice(0,7);
  const avgSleep=weekSleep.length?weekSleep.reduce((s,h)=>s+h.hrs,0)/weekSleep.length:0;
  const bestSleep=weekSleep.length?Math.max(...weekSleep.map(h=>h.hrs)):0;
  const worstSleep=weekSleep.length?Math.min(...weekSleep.map(h=>h.hrs)):0;
  const goalNights=weekSleep.filter(h=>h.hrs>=8).length;
  function sleepQ(h){if(h>=7.5)return"Optimal";if(h>=6.5)return"Good";if(h>=5)return"Fair";return"Poor";}
  const qDist={Optimal:0,Good:0,Fair:0,Poor:0};
  weekSleep.forEach(h=>{qDist[sleepQ(h.hrs)]++});

  // Nutrition stats (last 7 entries grouped loosely)
  const avgCal=macroLog.length?Math.round(macroLog.reduce((s,f)=>s+Number(f.cal),0)/Math.max(macroLog.length,1)):0;
  const avgProtein=macroLog.length?Math.round(macroLog.reduce((s,f)=>s+Number(f.protein),0)/Math.max(macroLog.length,1)):0;
  const avgCarbs=macroLog.length?Math.round(macroLog.reduce((s,f)=>s+Number(f.carbs),0)/Math.max(macroLog.length,1)):0;
  const avgFat=macroLog.length?Math.round(macroLog.reduce((s,f)=>s+Number(f.fat),0)/Math.max(macroLog.length,1)):0;

  // BMI
  function calcBMI(){
    if(!profile||!profile.weight||!profile.height)return null;
    let wKg=Number(profile.weight);
    if(profile.weightUnit==="lbs")wKg*=0.453592;
    let hM;
    if(profile.heightUnit==="cm"){hM=Number(profile.height)/100;}
    else{const r=String(profile.height),m=r.match(/(\d+)['\s.,](\d+)/);hM=m?(Number(m[1])*12+Number(m[2]))*0.0254:Number(r)*0.0254;}
    if(!hM||hM<=0)return null;
    return(wKg/(hM*hM)).toFixed(1);
  }
  const bmi=calcBMI();

  // AI insight state
  const [insight,setInsight]=useState(null);
  const [loadingInsight,setLoadingInsight]=useState(false);

  async function getInsight(){
    setLoadingInsight(true);
    try{
      const prompt=`You are a health coach. Based on this weekly summary, give ONE short encouraging insight (2 sentences max) and ONE specific actionable tip for next week. Be direct and personal.

Weekly data:
- Habits: ${completedToday}/${totalHabits} done today, ${bestStreak} day best streak, ${totalXP} XP earned
- Sleep: ${weekSleep.length} nights tracked, ${avgSleep.toFixed(1)}h average, ${goalNights} nights hit 8h goal
- Nutrition: ${macroLog.length} food items logged, avg ${avgCal} kcal/day, avg ${avgProtein}g protein
- BMI: ${bmi||"not calculated"}

Reply in this exact format:
INSIGHT: [your insight here]
TIP: [your tip here]`;

      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      const text=data.content?.map(b=>b.text||"").join("")||"";
      const insightMatch=text.match(/INSIGHT:\s*(.+)/);
      const tipMatch=text.match(/TIP:\s*(.+)/);
      setInsight({
        insight:insightMatch?insightMatch[1].trim():"Keep tracking your habits consistently this week.",
        tip:tipMatch?tipMatch[1].trim():"Try to log your meals every day for better nutrition insights."
      });
    }catch(e){
      setInsight({insight:"Keep going - consistency is the key to lasting change.",tip:"Focus on completing at least one habit every day this week."});
    }
    setLoadingInsight(false);
  }

  const ScoreCard=({label,value,sub,color})=>(
    <div style={{background:"#1e1e1e",borderRadius:16,padding:"14px 12px",textAlign:"center"}}>
      <div style={{fontSize:26,fontWeight:900,color:color||C.neon,letterSpacing:"-0.03em"}}>{value}</div>
      <div style={{fontSize:11,fontWeight:700,color:C.text,marginTop:2}}>{label}</div>
      {sub&&<div style={{fontSize:10,color:C.sub,marginTop:2}}>{sub}</div>}
    </div>
  );

  const Section=({title,children,accent})=>(
    <div style={{background:C.card,border:`1px solid ${accent||C.border}`,borderRadius:20,padding:18}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:C.sub,marginBottom:14}}>{title}</div>
      {children}
    </div>
  );

  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>
      <div>
        <h2 style={{fontSize:26,fontWeight:800,letterSpacing:"-0.03em",color:C.text,margin:0}}>Weekly Report</h2>
        <p style={{fontSize:13,color:C.sub,marginTop:4}}>
          {startOfWeek.toLocaleDateString("en-US",{month:"short",day:"numeric"})} - {now.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
        </p>
      </div>

      {/* Overall score */}
      <div style={{background:"linear-gradient(135deg,rgba(200,245,58,0.12),rgba(168,85,247,0.08))",border:`1px solid ${C.borderHi}`,borderRadius:24,padding:22}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:C.sub,marginBottom:16}}>THIS WEEK AT A GLANCE</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          <ScoreCard label="Habit Rate" value={completionPct+"%"} sub="today" color={C.neon}/>
          <ScoreCard label="XP Earned" value={totalXP} sub="this week" color={C.purple}/>
          <ScoreCard label="Best Streak" value={bestStreak+"d"} sub="days" color={C.coral}/>
        </div>
      </div>

      {/* Habits section */}
      <Section title="HABIT PERFORMANCE" accent="rgba(200,245,58,0.2)">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <ScoreCard label="Done Today" value={completedToday+"/"+totalHabits} color={C.neon}/>
          <ScoreCard label="Completion" value={completionPct+"%"} color={completionPct>=80?C.neon:completionPct>=50?C.amber:C.coral}/>
        </div>
        {habits.length===0?(
          <div style={{textAlign:"center",padding:"12px 0",color:C.sub,fontSize:13}}>No habits tracked yet. Add some habits to see your performance.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {habits.map(h=>(
              <div key={h.id} style={{display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:h.done?h.color:"rgba(255,255,255,0.15)",flexShrink:0}}/>
                <span style={{fontSize:13,color:C.text,flex:1}}>{h.name}</span>
                <span style={{fontSize:11,color:C.sub}}>{h.streak}d streak</span>
                <span style={{fontSize:11,fontWeight:700,color:h.done?h.color:C.sub}}>{h.done?"Done":"Pending"}</span>
              </div>
            ))}
          </div>
        )}
        <div style={{marginTop:14,padding:"10px 14px",background:"rgba(200,245,58,0.06)",borderRadius:12,display:"flex",justifyContent:"space-between"}}>
          <span style={{fontSize:12,color:C.sub}}>Total XP this week</span>
          <span style={{fontSize:13,fontWeight:800,color:C.neon}}>{totalXP} XP</span>
        </div>
      </Section>

      {/* Sleep section */}
      <Section title="SLEEP SUMMARY" accent="rgba(168,85,247,0.2)">
        {weekSleep.length===0?(
          <div style={{textAlign:"center",padding:"12px 0",color:C.sub,fontSize:13}}>No sleep tracked yet. Use the Sleep tab to log your rest.</div>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
              <ScoreCard label="Avg Sleep" value={avgSleep.toFixed(1)+"h"} color={C.purple}/>
              <ScoreCard label="Best Night" value={bestSleep.toFixed(1)+"h"} color={C.neon}/>
              <ScoreCard label="Goal Nights" value={goalNights+"/"+weekSleep.length} sub="hit 8h" color={C.teal}/>
            </div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:C.sub,marginBottom:8,letterSpacing:"0.06em"}}>RECENT NIGHTS</div>
              {weekSleep.slice(0,5).map((s,i)=>{
                const q=sleepQ(s.hrs);
                const qColor=q==="Optimal"?C.neon:q==="Good"?C.blue:q==="Fair"?C.amber:C.coral;
                const pct=Math.min(s.hrs/10,1);
                return(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                    <span style={{fontSize:11,color:C.sub,width:72,flexShrink:0}}>{s.date}</span>
                    <div style={{flex:1,height:6,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden"}}>
                      <div style={{height:"100%",width:pct*100+"%",background:qColor,borderRadius:99}}/>
                    </div>
                    <span style={{fontSize:11,fontWeight:700,color:qColor,width:36,textAlign:"right",flexShrink:0}}>{s.hrs.toFixed(1)}h</span>
                  </div>
                );
              })}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
              {[{l:"Optimal",c:C.neon},{l:"Good",c:C.blue},{l:"Fair",c:C.amber},{l:"Poor",c:C.coral}].map(q=>(
                <div key={q.l} style={{textAlign:"center",padding:"8px 4px",background:`${q.c}12`,borderRadius:10}}>
                  <div style={{fontSize:18,fontWeight:900,color:q.c}}>{qDist[q.l]}</div>
                  <div style={{fontSize:9,color:C.sub,marginTop:2}}>{q.l}</div>
                </div>
              ))}
            </div>
          </>
        )}
      </Section>

      {/* Nutrition section */}
      <Section title="NUTRITION SUMMARY" accent="rgba(255,107,107,0.2)">
        {macroLog.length===0?(
          <div style={{textAlign:"center",padding:"12px 0",color:C.sub,fontSize:13}}>No food logged yet. Use the Macros tab to track your nutrition.</div>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
              <ScoreCard label="Avg Calories" value={avgCal} sub="kcal/day" color={C.coral}/>
              <ScoreCard label="Items Logged" value={macroLog.length} sub="total entries" color={C.amber}/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {[{l:"Protein",v:avgProtein+"g",c:C.coral},{l:"Carbs",v:avgCarbs+"g",c:C.amber},{l:"Fat",v:avgFat+"g",c:C.purple}].map(m=>(
                <div key={m.l} style={{background:"#1e1e1e",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontSize:18,fontWeight:900,color:m.c}}>{m.v}</div>
                  <div style={{fontSize:10,color:C.sub,marginTop:2}}>avg {m.l}</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:12,padding:"10px 14px",background:"rgba(255,107,107,0.07)",borderRadius:12}}>
              <div style={{fontSize:11,color:C.sub,marginBottom:4}}>vs Daily Goal ({MG.cal} kcal)</div>
              <div style={{height:6,background:"rgba(255,255,255,0.06)",borderRadius:99,overflow:"hidden"}}>
                <div style={{height:"100%",width:Math.min(avgCal/MG.cal,1)*100+"%",background:C.coral,borderRadius:99}}/>
              </div>
              <div style={{fontSize:11,color:C.coral,marginTop:4,fontWeight:700}}>{Math.round(avgCal/MG.cal*100)}% of daily goal</div>
            </div>
          </>
        )}
      </Section>

      {/* Body & Progress */}
      <Section title="BODY AND PROGRESS" accent="rgba(245,158,11,0.2)">
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          <ScoreCard label="Weight" value={profile?.weight?profile.weight+" "+(profile.weightUnit||"kg"):"--"} color={C.amber}/>
          <ScoreCard label="BMI" value={bmi||"--"} color={bmi?Number(bmi)<18.5?C.blue:Number(bmi)<25?C.neon:Number(bmi)<30?C.amber:C.coral:C.sub}/>
          <ScoreCard label="Level" value={"Lv."+(Math.max(1,Math.floor(totalXP/500)+1))} color={C.purple}/>
        </div>
      </Section>

      {/* AI Insight */}
      <div style={{background:"linear-gradient(135deg,rgba(168,85,247,0.14),rgba(59,130,246,0.08))",border:"1px solid rgba(168,85,247,0.25)",borderRadius:20,padding:20}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:C.sub,marginBottom:12}}>AI COACH INSIGHT</div>
        {!insight&&!loadingInsight&&(
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,color:C.sub,marginBottom:14,lineHeight:1.6}}>Get a personalised summary and tip for next week based on your data.</div>
            <button onClick={getInsight} style={{padding:"12px 24px",borderRadius:13,border:"none",background:C.purple,color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>
              Generate My Report
            </button>
          </div>
        )}
        {loadingInsight&&(
          <div style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0"}}>
            <div style={{animation:"spin 0.8s linear infinite"}}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={C.purple} strokeWidth="2.5" strokeLinecap="round">
                <path d="M12 2a10 10 0 010 20" strokeOpacity="0.25"/>
                <path d="M12 2a10 10 0 0110 10"/>
              </svg>
            </div>
            <span style={{fontSize:13,color:C.purple,fontWeight:700}}>Analysing your week...</span>
          </div>
        )}
        {insight&&(
          <div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:11,fontWeight:700,color:C.purple,letterSpacing:"0.06em",marginBottom:6}}>THIS WEEK</div>
              <div style={{fontSize:14,color:C.text,lineHeight:1.6}}>{insight.insight}</div>
            </div>
            <div style={{padding:"12px 14px",background:"rgba(168,85,247,0.10)",borderRadius:12}}>
              <div style={{fontSize:11,fontWeight:700,color:C.purple,letterSpacing:"0.06em",marginBottom:6}}>TIP FOR NEXT WEEK</div>
              <div style={{fontSize:13,color:C.text,lineHeight:1.6}}>{insight.tip}</div>
            </div>
            <button onClick={()=>setInsight(null)} style={{marginTop:12,padding:"8px 16px",borderRadius:99,border:"1px solid rgba(168,85,247,0.3)",background:"transparent",color:C.purple,fontSize:12,fontWeight:700,cursor:"pointer"}}>
              Regenerate
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [onboarded,setOnboardedRaw]=useState(()=>lsGet('mom_onboarded',false));
  const [profile,setProfileRaw]=useState(()=>lsGet('mom_profile',null));
  const [tab,setTab]=useState(0);
  const [habits,setHabitsRaw]=useState(()=>{
    const saved=lsGet('mom_habits',[]);
    const lastDate=localStorage.getItem('mom_habits_date');
    const today=new Date().toDateString();
    if(lastDate!==today){
      const reset=saved.map(h=>({...h,streak:h.done?h.streak+1:Math.max(0,h.streak-1>=0?h.streak:0),done:false,progress:0}));
      lsSet('mom_habits',reset);localStorage.setItem('mom_habits_date',today);return reset;
    }
    return saved;
  });
  const [water,setWaterRaw]=useState(()=>{
    const s=lsGet('mom_water',null);
    const today=new Date().toDateString();
    return(s&&s.date===today)?s.cups:0;
  });
  const [waterGoal,setWaterGoalRaw]=useState(()=>lsGet('mom_water_goal',8));
  const [showAdd,setShowAdd]=useState(false);
  const [mounted,setMounted]=useState(false);

  const setOnboarded=v=>{setOnboardedRaw(v);lsSet('mom_onboarded',v);};
  const setProfile=fn=>{setProfileRaw(prev=>{const next=typeof fn==='function'?fn(prev):fn;lsSet('mom_profile',next);return next;});};
  const setHabits=fn=>{setHabitsRaw(prev=>{const next=typeof fn==='function'?fn(prev):fn;lsSet('mom_habits',next);return next;});};
  const setWater=fn=>{setWaterRaw(prev=>{const next=typeof fn==='function'?fn(prev):fn;lsSet('mom_water',{date:new Date().toDateString(),cups:next});return next;});};
  const setWaterGoal=fn=>{setWaterGoalRaw(prev=>{const next=typeof fn==='function'?fn(prev):fn;lsSet('mom_water_goal',next);return next;});};

  useEffect(()=>{setTimeout(()=>setMounted(true),60);},[]);

  if(!onboarded)return <Onboarding onDone={d=>{
    const profile={...d,age:d.age||"25",weight:d.weight||"70",height:d.height||(d.heightUnit==="cm"?"170":"67")};
    setProfile(profile);setOnboarded(true);
  }}/>;
  const userName=profile?.name||"Friend";

  const screens=[
    <HomeScreen   habits={habits} setHabits={setHabits} userName={userName} water={water} setWater={setWater} waterGoal={waterGoal}/>,
    <HabitsScreen habits={habits} setHabits={setHabits} onAdd={()=>setShowAdd(true)}/>,
    <MacrosScreen water={water} setWater={setWater} waterGoal={waterGoal} setWaterGoal={setWaterGoal}/>,
    <SleepScreen/>,
    <AnalyticsScreen habits={habits}/>,
    <WeeklyReport habits={habits} profile={profile}/>,
    <ProfileScreen habits={habits} userName={userName} profile={profile} onUpdateWeight={(w,u)=>setProfile(p=>({...p,weight:w,weightUnit:u}))}/>,
  ];

  return(
    <div style={{width:"100%",height:"100dvh",background:C.bg,fontFamily:"'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif",color:C.text,display:"flex",justifyContent:"center",overflow:"hidden"}}>
      <div style={{width:"100%",maxWidth:430,display:"flex",flexDirection:"column",height:"100%"}}>
        <div style={{padding:"12px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,paddingTop:"env(safe-area-inset-top,12px)"}}>
          <span style={{fontSize:12,fontWeight:700,color:C.sub}}>{new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>
          <div style={{background:"#1a1a1a",borderRadius:99,padding:"4px 12px",display:"flex",alignItems:"center",gap:7}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:C.neon,boxShadow:`0 0 7px ${C.neon}`}}/>
            <span style={{fontSize:12,fontWeight:700,color:C.neon}}>MOMENTUM</span>
          </div>
          <span style={{fontSize:12,color:C.sub}}>*</span>
        </div>

        <div style={{flex:1,overflowY:"scroll",WebkitOverflowScrolling:"touch",padding:"16px 20px 24px",opacity:mounted?1:0,transform:mounted?"none":"translateY(6px)",transition:"all 0.4s cubic-bezier(.4,0,.2,1)"}}>
          {screens[tab]}
        </div>

        <div style={{flexShrink:0,padding:"10px 18px",paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 12px)",background:"linear-gradient(0deg,#080808 80%,transparent)"}}>
          <div style={{background:"rgba(18,18,18,0.96)",backdropFilter:"blur(20px)",border:`1px solid ${C.borderHi}`,borderRadius:26,display:"flex",padding:"7px 10px",gap:3}}>
            {TABS.map((t,i)=>{
              const active=tab===i;
              return(
                <button key={t} onClick={()=>setTab(i)} style={{flex:1,padding:"9px 3px",borderRadius:18,border:"none",background:active?C.neon:"transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"all 0.22s",boxShadow:active?`0 0 14px ${C.neonG}`:"none"}}>
                  {NAV_SVG[i](active)}
                  <span style={{fontSize:8,fontWeight:700,color:active?"#000":C.muted,letterSpacing:"0.04em"}}>{t.toUpperCase()}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {showAdd&&<AddHabitModal onSave={h=>setHabits(p=>[...p,h])} onClose={()=>setShowAdd(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
